name: Release (audited fork)

on:
  push:
    tags:
      - "v*-fork.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing annotated fork release tag to publish"
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify-tag:
    name: Verify annotated fork tag on protected main
    if: >-
      github.repository == 'bonjinnorenka/rib' &&
      ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.verify.outputs.tag }}
      tag_oid: ${{ steps.verify.outputs.tag_oid }}
      commit: ${{ steps.verify.outputs.commit }}
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    steps:
      - name: Checkout main and full history (no persistent token)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Verify remote annotated tag, Cargo version and protected main ancestry
        id: verify
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-fork\.[0-9]+$ ]] || {
            echo "invalid fork release tag: $RELEASE_TAG" >&2; exit 1
          }

          # checkout@v4 fetches annotated tags and can replace refs/tags/<name>
          # with a peeled commit when checkout is triggered by a tag push.
          # Fetch the authoritative tag OBJECT into a separate, non-tag ref.
          git fetch --no-tags origin \
            "+refs/tags/$RELEASE_TAG:refs/validation/release-tag"
          tag_oid="$(git rev-parse refs/validation/release-tag)"
          [[ "$(git cat-file -t "$tag_oid")" == "tag" ]] || {
            echo "release tags must be annotated" >&2; exit 1
          }
          tag_name="$(git cat-file -p "$tag_oid" | sed -n 's/^tag //p' | head -n 1)"
          [[ "$tag_name" == "$RELEASE_TAG" ]] || {
            echo "tag object name does not match requested release tag" >&2; exit 1
          }
          tagged_commit="$(git rev-parse "refs/validation/release-tag^{commit}")"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          main_commit="$(git rev-parse refs/remotes/origin/main)"
          git merge-base --is-ancestor "$tagged_commit" "$main_commit" || {
            echo "tag target is not reachable from protected main" >&2; exit 1
          }

          # A manual rerun from main must still accept a release tag pointing
          # to an earlier reviewed main commit after this workflow fix merges.
          # Read the VERSION from the TAGGED commit, not current main.
          version="$(git show "$tagged_commit:Cargo.toml" |
            python3 -c 'import sys,tomllib; print(tomllib.loads(sys.stdin.read())["package"]["version"])')"
          [[ "$RELEASE_TAG" == "v$version" ]] || {
            echo "tag $RELEASE_TAG does not match tagged Cargo package version v$version" >&2; exit 1
          }

          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_SHA" != "$tagged_commit" ]]; then
            echo "tag target differs from push event SHA" >&2; exit 1
          fi
          {
            echo "tag=$RELEASE_TAG"
            echo "tag_oid=$tag_oid"
            echo "commit=$tagged_commit"
          } >> "$GITHUB_OUTPUT"
          echo "Verified annotated $RELEASE_TAG ($tag_oid) at reviewed main commit $tagged_commit"

  build:
    name: Build and attest Ubuntu 24.04 x86_64 GNU
    needs: verify-tag
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ needs.verify-tag.outputs.tag }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout exact verified release commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.verify-tag.outputs.commit }}
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.94.0
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Build pinned GNU executables
        run: cargo build --release --locked --target x86_64-unknown-linux-gnu --bin rib --bin cargo-rib
      - name: Smoke binary and package archive with SHA-256
        shell: bash
        run: |
          set -Eeuo pipefail
          ./target/x86_64-unknown-linux-gnu/release/rib --version | grep -F "${RELEASE_TAG#v}"
          ./target/x86_64-unknown-linux-gnu/release/cargo-rib --version
          archive="rib-${RELEASE_TAG}-x86_64-unknown-linux-gnu.tar.gz"
          mkdir -p dist
          tar -czf "dist/$archive" -C target/x86_64-unknown-linux-gnu/release rib cargo-rib
          (cd dist && sha256sum "$archive" > "$archive.sha256" && sha256sum --check "$archive.sha256")
      - name: Sign build provenance for distributable archive
        uses: actions/attest@v4
        with:
          subject-path: dist/rib-*.tar.gz
      - name: Independently verify provenance before publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh attestation verify dist/rib-*.tar.gz --repo "$GITHUB_REPOSITORY"
      - name: Upload release archive and checksum
        uses: actions/upload-artifact@v4
        with:
          name: rib-linux-x86_64-gnu
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish immutable-by-policy GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ needs.verify-tag.outputs.tag }}
      VERIFIED_TAG_OID: ${{ needs.verify-tag.outputs.tag_oid }}
    permissions:
      contents: write
    steps:
      - name: Download built and attested artifacts
        uses: actions/download-artifact@v4
        with:
          name: rib-linux-x86_64-gnu
          path: dist
      - name: Verify SHA-256 and create a new Release (never overwrite)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          (cd dist && sha256sum --check *.sha256)
          archive="rib-${RELEASE_TAG}-x86_64-unknown-linux-gnu.tar.gz"
          test -s "dist/$archive"
          # Catch tag replacement/deletion between verification and publishing.
          remote_tag_oid="$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')"
          [[ "$remote_tag_oid" == "$VERIFIED_TAG_OID" ]] || {
            echo "release tag changed since verification; refusing to publish" >&2; exit 1
          }
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "release already exists; refusing to overwrite" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" "dist/$archive" "dist/$archive.sha256" \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --generate-notes \
            --prerelease
