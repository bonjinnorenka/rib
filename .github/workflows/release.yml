name: Release (audited fork)

on:
  push:
    tags:
      - "v*-fork.*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify-tag:
    name: Verify annotated fork tag on current main
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout tag and complete history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tag, version, and protected main ancestry
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REF" == refs/tags/* ]] || { echo "not a tag event" >&2; exit 1; }
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-fork\.[0-9]+$ ]] || {
            echo "not a fork release tag: $GITHUB_REF_NAME" >&2
            exit 1
          }
          [[ "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" == "tag" ]] || {
            echo "release tags must be annotated" >&2; exit 1
          }
          version="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "rust-image-builder") | .version')"
          [[ "$GITHUB_REF_NAME" == "v$version" ]] || {
            echo "tag $GITHUB_REF_NAME does not match Cargo package version v$version" >&2; exit 1
          }
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          tagged_commit="$(git rev-parse "refs/tags/$GITHUB_REF_NAME^{commit}")"
          main_commit="$(git rev-parse refs/remotes/origin/main)"
          [[ "$tagged_commit" == "$GITHUB_SHA" ]] || {
            echo "tag target differs from workflow checkout" >&2; exit 1
          }
          git merge-base --is-ancestor "$tagged_commit" "$main_commit" || {
            echo "tag is not reachable from main" >&2; exit 1
          }
          [[ "$tagged_commit" == "$main_commit" ]] || {
            echo "release tag must point at the current main HEAD" >&2; exit 1
          }
          echo "Verified annotated $GITHUB_REF_NAME at main $main_commit"

  build:
    name: Build and attest Ubuntu 24.04 x86_64 GNU
    needs: verify-tag
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout verified tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.94.0
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Build pinned GNU executables
        run: cargo build --release --locked --target x86_64-unknown-linux-gnu --bin rib --bin cargo-rib
      - name: Smoke binary and package archive with SHA-256
        shell: bash
        run: |
          set -Eeuo pipefail
          ./target/x86_64-unknown-linux-gnu/release/rib --version | grep -F "0.2.0-fork.1"
          ./target/x86_64-unknown-linux-gnu/release/cargo-rib --version
          archive="rib-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu.tar.gz"
          mkdir -p dist
          tar -czf "dist/$archive" -C target/x86_64-unknown-linux-gnu/release rib cargo-rib
          (cd dist && sha256sum "$archive" > "$archive.sha256" && sha256sum --check "$archive.sha256")
      - name: Sign build provenance for distributable archive
        uses: actions/attest@v4
        with:
          subject-path: dist/rib-*.tar.gz
      - name: Independently verify provenance before publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh attestation verify dist/rib-*.tar.gz --repo "$GITHUB_REPOSITORY"
      - name: Upload release archive and checksum
        uses: actions/upload-artifact@v4
        with:
          name: rib-linux-x86_64-gnu
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish immutable-by-policy GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download built and attested artifacts
        uses: actions/download-artifact@v4
        with:
          name: rib-linux-x86_64-gnu
          path: dist
      - name: Verify SHA-256 and create a new Release (never overwrite)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          (cd dist && sha256sum --check *.sha256)
          archive="rib-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu.tar.gz"
          test -s "dist/$archive"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release already exists; refusing to overwrite" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" "dist/$archive" "dist/$archive.sha256" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --prerelease
